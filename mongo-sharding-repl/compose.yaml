name: mongo-sharding-repl

x-shard-healthcheck: &shard-healthcheck
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 20s

services:
  config_srv:
    image: mongo:latest
    container_name: config_srv
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - config-data:/data/db
    command:
      ["--configsvr", "--replSet", "config_server", "--bind_ip_all", "--port", "27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--quiet", "--eval", "db.adminCommand('ping')"]
      <<: *shard-healthcheck

  # ---------- shard 1 (replica set shard_1_replicaset) ----------
  shard_1_1:
    image: mongo:latest
    container_name: shard_1_1
    restart: always
    ports:
      - "27018:27018"
    volumes:
      - shard-1-1-data:/data/db
    command:
      ["--shardsvr", "--replSet", "shard_1_replicaset", "--bind_ip_all", "--port", "27018"]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--quiet", "--eval", "db.adminCommand('ping')"]
      <<: *shard-healthcheck

  shard_1_2:
    image: mongo:latest
    container_name: shard_1_2
    restart: always
    ports:
      - "27019:27019"
    volumes:
      - shard-1-2-data:/data/db
    command:
      ["--shardsvr", "--replSet", "shard_1_replicaset", "--bind_ip_all", "--port", "27019"]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27019", "--quiet", "--eval", "db.adminCommand('ping')"]
      <<: *shard-healthcheck

  shard_1_3:
    image: mongo:latest
    container_name: shard_1_3
    restart: always
    ports:
      - "27020:27020"
    volumes:
      - shard-1-3-data:/data/db
    command:
      ["--shardsvr", "--replSet", "shard_1_replicaset", "--bind_ip_all", "--port", "27020"]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27020", "--quiet", "--eval", "db.adminCommand('ping')"]
      <<: *shard-healthcheck

  # ---------- shard 2 (replica set shard_2_replicaset) ----------
  shard_2_1:
    image: mongo:latest
    container_name: shard_2_1
    restart: always
    ports:
      - "27021:27021"
    volumes:
      - shard-2-1-data:/data/db
    command:
      ["--shardsvr", "--replSet", "shard_2_replicaset", "--bind_ip_all", "--port", "27021"]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27021", "--quiet", "--eval", "db.adminCommand('ping')"]
      <<: *shard-healthcheck

  shard_2_2:
    image: mongo:latest
    container_name: shard_2_2
    restart: always
    ports:
      - "27022:27022"
    volumes:
      - shard-2-2-data:/data/db
    command:
      ["--shardsvr", "--replSet", "shard_2_replicaset", "--bind_ip_all", "--port", "27022"]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27022", "--quiet", "--eval", "db.adminCommand('ping')"]
      <<: *shard-healthcheck

  shard_2_3:
    image: mongo:latest
    container_name: shard_2_3
    restart: always
    ports:
      - "27023:27023"
    volumes:
      - shard-2-3-data:/data/db
    command:
      ["--shardsvr", "--replSet", "shard_2_replicaset", "--bind_ip_all", "--port", "27023"]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27023", "--quiet", "--eval", "db.adminCommand('ping')"]
      <<: *shard-healthcheck

  # ---------- router ----------
  mongos_router:
    image: mongo:latest
    container_name: mongos_router
    restart: always
    ports:
      - "27024:27024"
    depends_on:
      - config_srv
      - shard_1_1
      - shard_2_1
    command:
      ["mongos", "--configdb", "config_server/config_srv:27017", "--bind_ip_all", "--port", "27024"]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27024", "--quiet", "--eval", "db.adminCommand('ping')"]
      <<: *shard-healthcheck

  pymongo_api:
    container_name: pymongo_api
    build:
      context: api_app
      dockerfile: Dockerfile
    image: kazhem/pymongo_api:1.0.0
    depends_on:
      - mongos_router
    ports:
      - "8080:8080"
    environment:
      MONGODB_URL: "mongodb://mongos_router:27024"
      MONGODB_DATABASE_NAME: "somedb"

volumes:
  config-data:
  shard-1-1-data:
  shard-1-2-data:
  shard-1-3-data:
  shard-2-1-data:
  shard-2-2-data:
  shard-2-3-data:
